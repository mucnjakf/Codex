<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Codex</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body class="auth-bg">

    <div class="auth-card card">

        <!-- Header: logo + title -->
        <div class="auth-header">
            <a href="./index.html" class="auth-logo" style="justify-content:center">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect width="28" height="28" rx="6" fill="hsl(240,5.9%,10%)" />
                    <path d="M8 10l-3 4 3 4" stroke="white" stroke-width="1.75" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M20 10l3 4-3 4" stroke="white" stroke-width="1.75" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M16 8l-4 12" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".7" />
                </svg>
                Codex
            </a>
            <h1 class="auth-heading" style="margin-top:1.25rem">Admin sign in</h1>
            <p class="auth-sub">Access the Codex administration panel</p>
        </div>

        <!-- Form -->
        <div class="auth-body">
            <div class="form-group">
                <label class="label" for="adminEmail">Admin email</label>
                <input class="input" type="email" id="adminEmail" placeholder="admin@codex.dev" value="admin@codex.dev"
                    autocomplete="email">
            </div>
            <div class="form-group">
                <label class="label" for="adminPassword">Password</label>
                <input class="input" type="password" id="adminPassword" placeholder="••••••••" value="••••••••"
                    autocomplete="current-password">
            </div>
            <button class="btn btn-default w-full" style="margin-top:0.25rem" onclick="handleAdminLogin()">
                Sign in to admin
            </button>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
            <a href="./index.html">← Back to Codex</a>
        </div>

    </div>

    <div id="toast-container"></div>

    <script>
        function showToast(msg, type) {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast' + (type ? ' toast-' + type : '');
            t.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>${msg}`;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function handleAdminLogin() {
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPassword').value;
            if (!email || !pass) { showToast('Please fill in all fields.', 'destructive'); return; }
            showToast('Signing in…');
            setTimeout(() => { window.location.href = './admin-dashboard.html'; }, 700);
        }

        document.addEventListener('keydown', e => { if (e.key === 'Enter') handleAdminLogin(); });
    </script>
</body>

</html>
